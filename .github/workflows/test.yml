name: Tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.1
      - name: Check formatting
        run: deno fmt src/**/* --check
      - name: Run unit and integration tests
        run: deno test --allow-read --allow-env src/**/*_test.ts src/**/*_integration_test.ts

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.1
      - name: Run E2E tests
        run: LIVE_ENDPOINTS=true deno test --allow-read --allow-env --allow-net src/**/*_e2e_test.ts
        continue-on-error: true
