name: Tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.1
      - name: Check formatting
        run: deno fmt src/**/* --check
      - name: Run tests
        run: deno test --allow-read src/**/*_test.ts
